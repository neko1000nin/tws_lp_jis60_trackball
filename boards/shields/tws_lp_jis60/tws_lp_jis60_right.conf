CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Enable extended NKRO report for INT/LANG keys on macOS
CONFIG_ZMK_HID_KEYBOARD_NKRO_EXTENDED_REPORT=y

# Sleep settings
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# RGB LED Widget settings
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_SHOW_LAYER_CHANGE=n

# ---- PMW3610 trackball -------------------------------------------------------
# 感度・向きなどの調整は trackball_config.h で行う (ここは基本触らなくてよい)
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610=y
# NOTE: MOTION 信号用の NFC1 (P0.09) の GPIO 化は overlay 側の
#       `&uicr { nfct-pins-as-gpios; };` で行っている (CONFIG_NFCT_PINS_AS_GPIOS は非推奨のため)
# BLE 接続時にレポートが詰まってカーソルが飛ぶのを防ぐ (ms)。USB 専用なら 8 でもよい
CONFIG_PMW3610_REPORT_INTERVAL_MIN=12
# センサーが認識されない時は電源立ち上がり待ちを延ばしてみる (ms)
# CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=300
# デバッグ時 (USB ログでセンサーの初期化状況を見る)
# CONFIG_PMW3610_LOG_LEVEL_DBG=y

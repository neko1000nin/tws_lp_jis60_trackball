# patches/zmk-ble-adv-filter-active-profile.patch 用の設定 (右手側)
# build.sh がパッチを当てたビルドでだけ EXTRA_CONF_FILE として読み込む。
# 元の ZMK と同じ動作に戻すには CONFIG_ZMK_BLE_ADV_FILTER_ACTIVE_PROFILE=n にする

# 選択中の接続先 (プロファイル) の機器だけが接続できるようにする。
# 他の登録済み機器はコントローラの段階で拒否されるので「つながっているのにキーが届かない」状態にならない。
CONFIG_ZMK_BLE_ADV_FILTER_ACTIVE_PROFILE=y
# 起動後最初の制限つき接続待ちは接続要求を受け付けないため (理由未特定)、開始 3 秒後に 1 回始め直す
CONFIG_ZMK_BLE_ADV_FILTER_BOOT_RESTART_SEC=3
# 安全装置: 制限つきで 20 秒だれも接続しなければ制限なしに切り替える (選択中の相手が接続したら解除)
CONFIG_ZMK_BLE_ADV_FILTER_FALLBACK_TIMEOUT=20
